name: Release

# Тег v* → сборка игры и релиз на GitHub с архивом готовой сборки (играется из папки через любой веб-сервер).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cd dist && zip -r ../dedov-garage-${{ github.ref_name }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          name: Дедов гараж ${{ github.ref_name }}
          body: |
            [Играть онлайн](https://makedonskiyy.github.io/grandpa-garage/)

            В ZIP-архиве лежит готовая сборка игры для запуска через веб-сервер.
          generate_release_notes: true
          files: dedov-garage-${{ github.ref_name }}.zip
