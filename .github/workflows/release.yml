name: Release

# Тег v* → сборка игры и релиз на GitHub с архивом готовой сборки (играется из папки через любой веб-сервер).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cd dist && zip -r ../dedov-garage-${{ github.ref_name }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          name: Дедов гараж ${{ github.ref_name }} — первый прототип
          body: |
            Первый играбельный прототип для презентации.
            Играть онлайн: https://makedonskiyy.github.io/grandpa-garage/
            В архиве — готовая сборка (папка dist).
          files: dedov-garage-${{ github.ref_name }}.zip
