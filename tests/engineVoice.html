<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Engine voice offline verification</title>
  <pre id="result">Rendering…</pre>
  <script type="module">
    // Open /tests/engineVoice.html on the project's Vite dev server.
    import parts from '../data/parts.json';
    import { createRun, greenLight, startRun } from '../src/systems/drive.js';

    async function verify() {
      const { createEngineVoice } = await import('../src/systems/engineVoice.js');
      const rate = 48000;
      const context = new OfflineAudioContext(1, 3 * rate, rate);
      const build = { ...parts.initialBuild, tires: 'tires_stock' };
      const run = createRun('race', build);
      greenLight(run);
      startRun(run);
      const voice = createEngineVoice(context, context.destination, build);
      run.rpm = 1800;
      voice.update(run, { gas: 0.5 });
      const accelerate = context.suspend(0.75);
      const stop = context.suspend(1.5);
      const rendering = context.startRendering();
      await accelerate;
      run.rpm = 4800;
      voice.update(run, { gas: 1 });
      await context.resume();
      await stop;
      voice.stop();
      await context.resume();
      const samples = (await rendering).getChannelData(0);
      if (!samples.every(Number.isFinite)) throw new Error('Non-finite PCM sample');

      function rms(start, end) {
        const window = samples.subarray(start * rate, end * rate);
        return Math.sqrt(window.reduce((sum, value) => sum + value * value, 0) / window.length);
      }
      for (const start of [0.4, 1.1]) {
        if (rms(start, start + 0.2) < 1e-5) throw new Error(`Silent engine at ${start}s`);
      }
      // A four-stroke six-cylinder fires at 90 Hz at 1800 RPM and 240 Hz at 4800 RPM.
      function tone(start, hz) {
        let real = 0;
        let imaginary = 0;
        const window = samples.subarray(start * rate, (start + 0.2) * rate);
        for (const [index, value] of window.entries()) {
          const phase = (2 * Math.PI * hz * index) / rate;
          real += value * Math.cos(phase);
          imaginary += value * Math.sin(phase);
        }
        return Math.hypot(real, imaginary) / window.length;
      }
      for (const [start, expected, other] of [
        [0.4, 90, 240],
        [1.1, 240, 90],
      ]) {
        if (tone(start, expected) < 0.01 || tone(start, expected) < 2 * tone(start, other))
          throw new Error(`Missing dominant firing tone at ${expected} Hz`);
      }
      if (rms(2.75, 3) > 1e-6) throw new Error('Engine still audible after stop');
      // Compare builds at identical RPM and pedal position. Normalized spectral
      // bands distinguish changes in tone from a simple volume multiplier.
      async function spectrum(overrides) {
        const ctx = new OfflineAudioContext(1, rate, rate);
        const setup = { ...build, engine: 'engine_stock', ...overrides };
        const state = createRun('race', setup);
        state.started = true;
        state.gear = 3;
        state.v = 22;
        state.rpm = 4800;
        const motor = createEngineVoice(ctx, ctx.destination, setup);
        motor.update(state, { gas: 1, brake: 0 });

        // Analyse the rendered PCM directly to include every output layer.
        const pcm = (await ctx.startRendering()).getChannelData(0);
        const bands = [1, 2, 3, 4, 5, 6, 7, 8].map((harmonic) => {
          let re = 0,
            im = 0;
          for (let i = rate / 2; i < rate; i++) {
            const phase = (2 * Math.PI * 240 * harmonic * i) / rate;
            re += pcm[i] * Math.cos(phase);
            im += pcm[i] * Math.sin(phase);
          }
          return Math.hypot(re, im);
        });
        if (!pcm.every((v) => Number.isFinite(v) && Math.abs(v) < 1)) throw Error('Invalid mix');
        return bands.map((energy) => energy / Math.max(...bands));
      }
      const stock = await spectrum({});
      for (const variant of [
        { engine: 'engine_tuned' },
        { engine: 'engine_turbo' },
        { exhaust: 'exhaust_straight' },
      ]) {
        const profile = await spectrum(variant);
        if (Math.max(...profile.map((v, i) => Math.abs(v - stock[i]))) < 0.025)
          throw Error('Indistinct tone: ' + JSON.stringify(variant));
      }
    }

    async function verifyTires() {
      const { createTireVoice } = await import('../src/systems/tireVoice.js');
      async function rms(surface, tire, physics) {
        const ctx = new OfflineAudioContext(1, 24000, 24000);
        const voice = createTireVoice(ctx, ctx.destination, tire);
        voice.update(
          { green: true, v: 0, slip: 0, lock: 0, sink: 0, stuckTimer: 0, ...physics },
          { gas: 1, brake: 0 },
          surface,
        );
        const pcm = (await ctx.startRendering()).getChannelData(0);
        if (!pcm.every((v) => Number.isFinite(v) && Math.abs(v) < 1))
          throw Error('Invalid tire mix');
        return Math.sqrt(pcm.reduce((sum, v) => sum + v * v, 0) / pcm.length);
      }
      const silent = await rms('asphalt', 'tires_stock', {});
      const sliding = await rms('asphalt', 'tires_stock', { v: 18, lock: 1 });
      const rolling = await rms('asphalt', 'tires_stock', { v: 18 });
      const slicks = await rms('asphalt', 'tires_slicks', { v: 18 });
      const studded = await rms('asphalt', 'tires_studded', { v: 18 });
      const stuck = await rms('deep', 'tires_mud', { sink: 1, stuckTimer: 1 });
      if (silent !== 0 || sliding < rolling * 1.25 || studded < slicks * 1.25 || stuck < 0.01)
        throw Error('Missing tire response');
    }
    const result = document.querySelector('#result');
    Promise.all([verify(), verifyTires()]).then(
      () => (result.textContent = 'PASS'),
      (error) => (result.textContent = `FAIL\n${error.stack || error}`),
    );
  </script>
</html>
