<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Дедов гараж — пиксельный симулятор сборки машины. Команда TRITON."
    />
    <title>Дедов гараж</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!--
      #stage — рамка 640×360 в игровых пикселях, масштабируется целиком (см. src/systems/scale.js).
      Внутри два слоя одинакового размера:
        #game    — канвас Phaser (фоны, машины, диалоги, анимация);
        #ui-root — HTML-оверлей (кнопки, панели, настройки, карточки деталей).
    -->
    <div id="stage">
      <div id="game"></div>
      <div id="ui-root"></div>
    </div>
    <noscript>Для игры нужен включённый JavaScript.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
